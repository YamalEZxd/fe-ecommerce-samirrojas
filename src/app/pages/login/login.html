<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Samir Rojas · E-commerce</h2>
      <p>Bienvenido, inicie sesión para continuar</p>
    </div>

    @if (errorMessage()) {
      <div class="alert-error">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" [(ngModel)]="username" required placeholder="Ej. admin" class="form-control">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" [(ngModel)]="password" required placeholder="••••••••" class="form-control">
      </div>
      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        @if (isLoading()) {
          <span>Ingresando...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>
  </div>
</div>
